<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RiskChain AI | Secure Terminal Auth</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<!-- Styles are in: login_style.css -->
<link rel="stylesheet" href="login_style.css">
</head>
<body>

<!-- ── Animated cyber-grid background ── -->
<div class="cyber-grid"></div>

<!-- ── Auth Card ── -->
<div class="auth-container">

    <!-- Logo Row -->
    <div class="logo-container">
        <div class="logo-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                <line x1="12" y1="22.08" x2="12" y2="12"></line>
            </svg>
        </div>
        <div class="logo-text">RiskChain<span>.AI</span></div>
    </div>

    <div class="subtitle">Secure Auth Terminal v2.0</div>

    <!-- Tab Bar: Auth / Register -->
    <div class="tabs">
        <button class="tab active" onclick="switchTab('login')">Auth</button>
        <button class="tab"        onclick="switchTab('register')">Register</button>
    </div>

    <!-- ══ LOGIN FORM ══ -->
    <div id="loginForm">
        <div id="loginError" class="error"></div>

        <div class="input-group">
            <label>Agent Email</label>
            <input type="email" id="loginEmail" placeholder="agent@riskchain.ai" />
        </div>

        <div class="input-group">
            <label>Security Key</label>
            <input type="password" id="loginPassword" placeholder="••••••••••••" />
        </div>

        <button class="btn-primary" onclick="doLogin()">
            Initialize Link
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
        </button>

        <div class="divider">External Provider</div>

        <a href="/accounts/google/login/" class="btn-google">
            <!-- Google Logo SVG -->
            <svg width="18" height="18" viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.5 0 6.3 1.2 8.4 3.1l6.3-6.3C34.9 2.9 29.8 1 24 1 14.8 1 7 6.7 3.7 14.6l7.3 5.7C12.7 13.4 17.9 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.9 7.2l7.5 5.8c4.4-4 7.2-9.9 7.2-17z"/>
                <path fill="#FBBC05" d="M11 28.3c-.5-1.5-.8-3-.8-4.8s.3-3.3.8-4.8l-7.3-5.7C1.9 16.5 1 20.1 1 24s.9 7.5 2.7 10.8l7.3-5.5z"/>
                <path fill="#34A853" d="M24 47c5.8 0 10.7-1.9 14.3-5.1l-7.5-5.8c-2 1.4-4.5 2.2-6.8 2.2-6.1 0-11.3-3.9-13-9.3l-7.3 5.5C7 41.3 14.8 47 24 47z"/>
            </svg>
            Google Identity
        </a>

        <!-- Demo credentials hint (remove before production!) -->
        <div class="demo-hint">
            [SYS_MSG] TEST CREDENTIALS:<br>
            USER: <strong>demo@riskchain.ai</strong><br>
            PASS: <strong>RiskChain2025!</strong>
        </div>
    </div>

    <!-- ══ REGISTER FORM ══ -->
    <div id="registerForm" style="display:none">
        <div id="regError" class="error"></div>

        <div class="input-group">
            <label>Agent Identifier</label>
            <input type="text" id="regName" placeholder="John Doe" />
        </div>

        <div class="input-group">
            <label>Agent Email</label>
            <input type="email" id="regEmail" placeholder="agent@company.com" />
        </div>

        <div class="input-group">
            <label>New Security Key</label>
            <input type="password" id="regPassword" placeholder="Strong Passcode" />
        </div>

        <button class="btn-primary" onclick="doRegister()">
            Generate Clearance
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
        </button>

        <div class="divider">External Provider</div>

        <a href="/accounts/google/login/" class="btn-google">
            <svg width="18" height="18" viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.5 0 6.3 1.2 8.4 3.1l6.3-6.3C34.9 2.9 29.8 1 24 1 14.8 1 7 6.7 3.7 14.6l7.3 5.7C12.7 13.4 17.9 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.9 7.2l7.5 5.8c4.4-4 7.2-9.9 7.2-17z"/>
                <path fill="#FBBC05" d="M11 28.3c-.5-1.5-.8-3-.8-4.8s.3-3.3.8-4.8l-7.3-5.7C1.9 16.5 1 20.1 1 24s.9 7.5 2.7 10.8l7.3-5.5z"/>
                <path fill="#34A853" d="M24 47c5.8 0 10.7-1.9 14.3-5.1l-7.5-5.8c-2 1.4-4.5 2.2-6.8 2.2-6.1 0-11.3-3.9-13-9.3l-7.3 5.5C7 41.3 14.8 47 24 47z"/>
            </svg>
            Google Identity
        </a>
    </div>

</div><!-- end .auth-container -->

<!-- JavaScript is in: login_script.js -->
<script src="login_script.js"></script>
</body>
</html>
